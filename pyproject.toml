[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clear-robot"
version = "0.1.0"
description = "CLEAR: Combining Scene Changes and Action Trajectories for Robot Control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/Jason2Wang07/CLEAR"
Models = "https://huggingface.co/Jason2Jason/CLEAR"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["starVLA*", "latent_action_model*", "deployment*", "data_processing*", "examples*"]
exclude = ["*tests*", "*__pycache__*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "latent_action_model/action_ae/beta_vae_test.py",
    "latent_action_model/libero_stage2/temporal_adapter_04s_test.py",
    "latent_action_model/robotwin_stage2/paired_test.py",
    "latent_action_model/robotwin_stage2/sidecar_binding_test.py",
    "latent_action_model/robotwin_stage2/state_transform_test.py",
    "starVLA/model/framework/vlas/flowmatching_expert_test.py",
    "starVLA/model/framework/vlas/lawam_stage2_phase_test.py",
    "starVLA/training/stage2_phase_test.py",
    "starVLA/training/training_state_test.py",
    "starVLA/training/trainer_utils/checkpoint_loading_test.py",
]
python_files = ["test_*.py", "*_test.py"]
