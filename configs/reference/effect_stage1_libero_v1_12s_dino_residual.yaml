seed_everything: 20260803

model:
  dim: 1024
  num_heads: 16
  ffn_expansion_factor: 4
  enc_layers: 24
  codebook_size: 32
  code_dim: 32
  max_state_dim: 14
  num_frames: 2
  num_queries: 1
  vq_kwargs: {layer_norm: true}
  dec_layers: 12
  dropout: 0.0
  lambda_aux: 1.0
  loss_type: smooth_l1
  state_loss_type: l2
  vision_model_id: /data/250010178/ActionVAE/LaWAM/weights/dinov3-vitb16-pretrain-lvd1689m
  norm_latents: true
  norm_latents_type: ln
  vq_type: vae
  enc_add_state: false
  enc_modal_mask: true
  latent_layer_to_use: -2
  multi_input: false
  num_embodiments: 32
  image_hw: [256, 256]
  patch_size: 16
  image_aug: true
  dual_view_aug: true
  decoder_last_ln: true
  init_checkpoint: /data/250010178/ActionVAE/LaWAM/latent_action_model/logs/dino_large_vae/lam_release/checkpoints/pytorch_model.pt
  teacher_graph_path: /data/share/libero/processed_data/actionvae/stage1_artifacts/libero_v1_12s_dino_residual/train_teacher_graph.npz
  latent_bank_path: /data/share/libero/processed_data/actionvae/stage1_artifacts/libero_v1_12s_dino_residual/release_latent_bank.npz
  neighbor_backend: faiss
  student_gamma: null
  teacher_bandwidth_scale: 0.30
  teacher_bandwidth_floor: 1.0e-6
  neighbor_weight_target: 0.05
  neighbor_zero_epochs: 1
  neighbor_ramp_epochs: 4
  steps_per_epoch: 342
  total_epochs: 40
  full_latent_bank_refresh_epochs: [5, 10, 15, 20, 25, 30, 35]
  lr_idm: 3.0e-5
  lr_vae: 3.0e-5
  lr_lawm_decoder: 1.0e-5
  lr_state_decoder: 3.0e-5
  adamw_betas: [0.9, 0.95]
  adamw_eps: 1.0e-8
  weight_decay: 1.0e-2
  exclude_bias_norm_from_wd: true
  warmup_epochs: 1
  min_lr_ratio: 0.1
  kl_beta: 1.0e-5
  project: lawam-stage1-effect-libero-v1-12s-dino-residual
  task_name: effect-stage1-libero-v1-12s-dino-residual
  wandb_offline: true

data:
  data_root: /data/share/libero/processed_data/actionvae/libero_actionvae_v1_12s/effect
  batch_size: 64
  num_workers: 4
  train_block_size: 1024
  eval_block_size: 512
  max_open_shards: 8
  drop_last: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  in_order: true
  seed: 20260803
  verify_row_identity: true
  train_sampling: mixed_balanced
  natural_fraction: 0.5

trainer:
  max_epochs: 40
  accelerator: gpu
  devices: 2
  strategy: ddp_find_unused_parameters_false
  use_distributed_sampler: false
  accumulate_grad_batches: 4
  precision: bf16-mixed
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  val_check_interval: 1.0
  num_sanity_val_steps: 2
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: /data/share/libero/experiments/actionvae/libero_v1_12s/stage1-dino-v1-s20260803/checkpoints
        filename: "epoch-{epoch:02d}"
        auto_insert_metric_name: false
        save_top_k: -1
        save_last: true
        every_n_epochs: 1
        save_on_train_epoch_end: true
    - class_path: latent_action_model.core.lam_lightinng.SaveConfigToCheckpointCallback
  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: /data/share/libero/experiments/actionvae/libero_v1_12s
        name: stage1-dino-v1-s20260803
